# Editor for TarynforMayor.com — volunteers log in at tarynformayor.com/admin
backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Add {{collection}} “{{slug}}” (via website editor)'
    update: 'Update {{collection}} “{{slug}}” (via website editor)'
    delete: 'Delete {{collection}} “{{slug}}” (via website editor)'
    uploadMedia: 'Upload photo “{{path}}” (via website editor)'
    deleteMedia: 'Delete photo “{{path}}” (via website editor)'

site_url: https://tarynformayor.com
display_url: https://tarynformayor.com
logo_url: /uploads/2026_03_PNG-FILE-2-e1773247885725.png
media_folder: src/uploads
public_folder: /uploads
publish_mode: simple
locale: en

collections:
  # ---------------- EVENTS ----------------
  - name: events
    label: "📅 Events"
    label_singular: "Event"
    description: "To add an event, click the purple “+ Event” button. Events disappear from the homepage by themselves after they happen."
    folder: src/events
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor: { preview: false }
    sortable_fields:
      - { field: start, label: "Date", default_sort: desc }
      - { field: title, label: "Name" }
    summary: "{{start | date('ddd, MMM D, YYYY')}}  ·  {{title}}"
    view_groups: [{ label: "Type of event", field: category }]
    view_filters:
      - { label: "Volunteer page shifts only", field: volunteer_page, pattern: true }
    fields:
      - { label: "1. Event name", name: title, widget: string, hint: "Example: Coffee & Conversation @ Buddy Brew" }
      - { label: "2. Date and start time", name: start, widget: datetime, format: "YYYY-MM-DDTHH:mm", date_format: "MMMM D, YYYY", time_format: "h:mm A", picker_utc: false, hint: "Click the box and pick the day and time (Tampa time)." }
      - { label: "3. End time", name: end, widget: datetime, format: "YYYY-MM-DDTHH:mm", date_format: "MMMM D, YYYY", time_format: "h:mm A", picker_utc: false, required: false }
      - { label: "4. Type of event", name: category, widget: select, default: "Community", options: ["Coffee & Conversation", "Volunteer", "Fundraiser", "Community", "Election Date"], hint: "“Coffee & Conversation” events also appear on the Coffee page. “Election Date” shows in the Key Dates strip." }
      - { label: "Show on the volunteer page", name: volunteer_page, widget: boolean, default: false, required: false, hint: "Turn on for canvasses, phone banks, petition shifts, and anything volunteers should see at tarynformayor.com/volunteer" }
      - { label: "5. Place name", name: location, widget: string, required: false, hint: "Example: Buddy Brew (Bay to Bay)" }
      - { label: "6. Street address", name: address, widget: string, required: false }
      - { label: "7. RSVP or ticket link", name: rsvp_link, widget: string, required: false, hint: "Copy the link from Anedot or Mobilize and paste it here. Leave empty if people don’t need to RSVP." }
      - { label: "8. Flyer or photo", name: image, widget: image, required: false, choose_url: false, hint: "Click “Choose an image” and pick the flyer from your computer." }
      - { label: "9. Description", name: body, required: false, widget: markdown, modes: [rich_text], buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list], editor_components: [image] }
      - { label: "Hide this event from the website", name: draft, widget: boolean, default: false, required: false, hint: "Turn on to hide it without deleting it." }

  # ---------------- NEWS ----------------
  - name: news
    label: "📰 News & Updates"
    label_singular: "News post"
    description: "To write a post, click the purple “+ News post” button. The newest post shows first on the homepage."
    folder: src/news
    create: true
    slug: "{{slug}}"
    editor: { preview: false }
    sortable_fields:
      - { field: date, label: "Date", default_sort: desc }
      - { field: title, label: "Headline" }
    summary: "{{date | date('MMM D, YYYY')}}  ·  {{title}}"
    fields:
      - { label: "1. Headline", name: title, widget: string }
      - { label: "2. Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "MMMM D, YYYY", time_format: false, picker_utc: true, hint: "Usually today’s date." }
      - { label: "3. Category", name: category, widget: select, default: "Campaign", options: ["Campaign", "Press Release", "In the News", "Achievement"], hint: "Use “In the News” for articles written about Taryn by newspapers or TV." }
      - { label: "4. Main picture", name: image, widget: image, required: false, choose_url: false, hint: "Square pictures look best." }
      - { label: "5. One-sentence summary", name: summary, widget: text, required: false, hint: "Shows when someone shares the post on Facebook." }
      - { label: "6. The story", name: body, widget: markdown, modes: [rich_text], buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list], editor_components: [image] }
      - { label: "Link to the outside article", name: external_link, widget: string, required: false, hint: "Only for “In the News” posts: paste the newspaper’s link and a “Read the full story” button appears." }
      - { label: "Hide this post from the website", name: draft, widget: boolean, default: false, required: false }

  # ---------------- HOMEPAGE (one small section at a time) ----------------
  - name: homepage
    label: "🏠 Homepage"
    description: "Each item below is one section of the homepage, in the order they appear."
    editor: { preview: false }
    files:
      - name: hero
        label: "1. Top banner (headline and big photo)"
        file: src/_data/home/hero.json
        fields:
          - { label: "Small line above the headline", name: kicker, widget: string }
          - { label: "Big headline", name: headline, widget: string }
          - { label: "Sentence under the headline", name: summary, widget: text }
          - { label: "Button text", name: button_text, widget: string }
          - { label: "Photo of Taryn", name: photo, widget: image, choose_url: false, hint: "Must be a cut-out photo (no background). Ask Erin before changing." }
      - name: about
        label: "2. Meet Taryn (bio, quote, numbers)"
        file: src/_data/home/about.json
        fields:
          - { label: "Intro sentence", name: intro, widget: text }
          - { label: "Main photo", name: photo, widget: image, choose_url: false }
          - { label: "Small overlapping photo", name: photo_2, widget: image, required: false, choose_url: false }
          - label: "Bio paragraphs"
            name: sections
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { label: "Short heading", name: heading, widget: string }
              - { label: "Paragraph", name: text, widget: text }
          - { label: "Quote (dark purple band)", name: quote, widget: text }
          - label: "Numbers (e.g. 40+ Public Projects)"
            name: stats
            widget: list
            summary: "{{fields.number}}  {{fields.label}}"
            fields:
              - { label: "Number", name: number, widget: string }
              - { label: "What it counts", name: label, widget: string }
      - name: video
        label: "3. Video"
        file: src/_data/home/video.json
        fields:
          - { label: "Heading", name: heading, widget: string }
          - { label: "Text", name: text, widget: text }
          - { label: "YouTube link", name: youtube, widget: string, required: false, hint: "Copy the address of the YouTube video and paste it here. Leave empty to hide this section." }
      - name: issues
        label: "4. On the Issues"
        file: src/_data/home/issues.json
        fields:
          - { label: "Intro sentence", name: intro, widget: text }
          - label: "Issues"
            name: list
            widget: list
            summary: "{{fields.tag}}: {{fields.title}}"
            hint: "Drag issues up or down to change the order."
            fields:
              - { label: "Tab name (one or two words)", name: tag, widget: string }
              - { label: "Title", name: title, widget: string }
              - { label: "Paragraph", name: text, widget: text }
              - label: "Read-more links"
                name: links
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: "Link text", name: label, widget: string }
                  - { label: "Web address", name: url, widget: string, hint: "A page on this site (like /coffee/) or a full link starting with https://" }
      - name: community
        label: "5. Crowd photo band"
        file: src/_data/home/community.json
        fields:
          - { label: "Heading", name: heading, widget: string }
          - { label: "Text", name: text, widget: text }
          - { label: "Wide photo of supporters", name: photo, widget: image, choose_url: false }
      - name: forms
        label: "6. Sign-up and volunteer forms"
        file: src/_data/home/forms.json
        fields:
          - { label: "Email sign-up heading", name: signup_heading, widget: string }
          - { label: "Email sign-up text", name: signup_text, widget: text }
          - { label: "Volunteer heading", name: volunteer_heading, widget: string }
          - { label: "Volunteer text", name: volunteer_text, widget: text }
          - { label: "Volunteer checkboxes", name: volunteer_options, widget: list, hint: "The choices people can tick (Phone Bank, Knock Doors…)." }
      - name: donate
        label: "7. Donate section"
        file: src/_data/home/donate.json
        fields:
          - { label: "Heading", name: heading, widget: string }
          - { label: "Text", name: text, widget: text }
          - { label: "Italic line", name: tagline, widget: string }
          - { label: "Amount buttons", name: amounts, widget: list, hint: "Example: $250. The donate link itself is under Site Settings." }

  # ---------------- VOLUNTEER PAGE ----------------
  - name: volunteer
    label: "🙋 Volunteer Page"
    description: "The page to send volunteers: tarynformayor.com/volunteer. Shifts appear there automatically — just turn on “Show on the volunteer page” when you add an event."
    editor: { preview: false }
    files:
      - name: volunteer
        label: "Volunteer page words and photo"
        file: src/_data/volunteer.json
        fields:
          - { label: "Big heading", name: heading, widget: string }
          - { label: "Intro text", name: intro, widget: text }
          - { label: "Photo", name: photo, widget: image, choose_url: false }
          - { label: "Heading above the shifts", name: shifts_heading, widget: string }
          - { label: "Heading when there are no shifts", name: no_shifts_heading, widget: string }
          - { label: "Text when there are no shifts", name: no_shifts_text, widget: text }
          - { label: "Sign-up form heading", name: form_heading, widget: string }
          - { label: "Sign-up form text", name: form_text, widget: text }

  # ---------------- OTHER PAGES ----------------
  - name: pages
    label: "📄 Other Pages"
    label_singular: "Page"
    description: "Coffee & Conversation, Internships, Business Survey, the Rays plan, and the Privacy Policy."
    folder: src/pages
    create: true
    slug: "{{slug}}"
    editor: { preview: false }
    fields:
      - { label: "Page title", name: title, widget: string, hint: "For a new page, the title becomes its web address (“Yard Signs” → tarynformayor.com/yard-signs/)." }
      - { label: "Page text", name: body, required: false, widget: markdown, modes: [rich_text], buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list], editor_components: [image] }
      - { label: "Form or map to show on the page", name: embed, widget: string, required: false, hint: "Paste the “embed” link of an Airtable form, Google Form, or Google map." }
      - { label: "Also list upcoming Coffee & Conversations", name: show_coffee_events, widget: boolean, default: false, required: false }

  # ---------------- SETTINGS ----------------
  - name: settings
    label: "⚙️ Site Settings"
    editor: { preview: false }
    files:
      - name: settings
        label: "Announcement bar, donate link, contact info"
        file: src/_data/settings.json
        fields:
          - { label: "Announcement bar", name: announcement, widget: string, required: false, hint: "Optional message across the top of every page, e.g. “Early voting starts Feb 15!” Leave empty to hide it." }
          - { label: "Donate link (Anedot)", name: donate_url, widget: string }
          - { label: "Phone", name: phone, widget: string }
          - { label: "Email", name: email, widget: string }
          - { label: "Mailing address", name: mailing_address, widget: string }
          - { label: "Facebook link", name: facebook, widget: string, required: false }
          - { label: "Instagram link", name: instagram, widget: string, required: false }
          - { label: "YouTube channel link", name: youtube, widget: string, required: false }
          - { label: "“Paid for by” line", name: disclaimer, widget: string, hint: "Required by Florida law. Only change it if the campaign’s legal name changes." }
          - { label: "Website name", name: site_title, widget: string }
          - { label: "Website description (Google and sharing)", name: site_description, widget: text }
          - { label: "Picture shown when the site is shared", name: share_image, widget: image, choose_url: false }
      - name: advanced
        label: "Advanced (please don’t change)"
        file: src/_data/advanced.json
        fields:
          - { label: "Mailchimp form address", name: mailchimp_form_url, widget: string }
          - { label: "Mailchimp tag numbers", name: mailchimp_tags, widget: string, required: false }
          - { label: "Google Tag Manager ID", name: google_tag_manager_id, widget: string, required: false }
